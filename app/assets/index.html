<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Map</title>
<script src="plotly.min.js"></script>
<script src="data.js"></script>
<script src="extra.js"></script>
<script src="guide.js"></script>
<style>
:root{--bg:#fafaf8;--fg:#1d1d1b;--muted:#6b6b66;--card:#fff;--line:#e3e2dc;--accent:#2a6fdb;--warm:#c2410c;--soft:#f3f2ee;
 --t-contract:#2a6fdb;--t-legal:#7c3aed;--t-controversy:#c2410c;--t-protest:#be123c;--t-policy:#0f766e;--t-issue:#a16207}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ecebe6;--muted:#a3a29b;--card:#1e1e1c;--line:#33332f;--accent:#6ea0ff;--warm:#f08a4b;--soft:#262624;
 --t-contract:#6ea0ff;--t-legal:#a78bfa;--t-controversy:#f08a4b;--t-protest:#fb7185;--t-policy:#2dd4bf;--t-issue:#facc15}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0;flex:1 1 auto}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
input{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);width:220px}
.wrap{flex:1;display:grid;grid-template-columns:1fr 400px;min-height:0}
#map{min-height:0}
aside{border-left:1px solid var(--line);overflow:auto;padding:16px;background:var(--card)}
aside h2{font-size:20px;margin:0 0 2px}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
.sub{color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--soft);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.bar{height:8px;border-radius:4px;background:var(--accent);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--warm)}
.legend{font-size:12px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.filters button{font-size:12px;padding:2px 8px}
.item{border-left:3px solid var(--c);padding:6px 0 6px 10px;margin:6px 0}
.item b{display:block}
.item .meta{font-size:12px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;color:#fff;background:var(--c);margin-right:6px}
.item a{color:var(--accent);font-size:12px}
.none{color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--warm);color:#fff}
ol{padding-left:22px;margin:0}ol li{cursor:pointer;padding:2px 0}ol li:hover{color:var(--accent)}
a.back{color:var(--accent);cursor:pointer;font-size:13px}
svg text{fill:var(--muted);font-size:10px}
.note{font-size:11px;color:var(--muted);margin-top:20px}
details{border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--card)}
summary{cursor:pointer;padding:6px 10px;font-weight:600}
summary span{color:var(--muted);font-weight:400}
details .body{padding:0 10px 8px;max-height:420px;overflow:auto}
details .row{padding:3px 0;border-top:1px solid var(--line);font-size:13px}
details .row small{color:var(--muted)}
.conf{border-left:3px solid var(--c,var(--line));padding:6px 0 6px 10px;margin:6px 0;font-size:13px}
.conf b{display:block;font-size:14px}
.conf .meta{color:var(--muted);font-size:12px}
.live{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;background:#be123c;color:#fff;margin-right:6px}
.ffind{width:100%;margin:4px 0 6px}
.explain{font-size:13px;color:var(--muted);margin:2px 0 8px}
.titlebar{display:flex;align-items:center;gap:10px}
.flag{height:28px;border-radius:3px;border:1px solid var(--line)}
.people{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.person{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:8px;padding:6px}
.person img,.person .ph{width:52px;height:64px;object-fit:cover;border-radius:6px;flex:none;background:var(--line)}
.person b{display:block;font-size:13px;line-height:1.3}
.person span{font-size:11px;color:var(--muted)}
.kind{display:flex;gap:10px;align-items:flex-start;margin:12px 0 4px;padding-top:8px;border-top:2px solid var(--line)}
.kind img{width:96px;height:64px;object-fit:cover;border-radius:6px;flex:none;background:var(--line)}
.kind b{display:block}
.kind p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.row.pic{cursor:pointer}
.row.pic::after{content:" 📷";font-size:11px}
.row .shot{display:block;max-width:100%;max-height:220px;border-radius:6px;margin:6px 0}
.row .off{display:block;font-size:12px;color:var(--muted);margin:4px 0}
.gcard{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.gcard img{width:110px;height:72px;object-fit:cover;border-radius:6px;flex:none;background:var(--line)}
.gcard b{display:block}.gcard p{margin:2px 0 0;font-size:13px;color:var(--muted)}
@media (max-width:800px){.wrap{grid-template-columns:1fr;grid-template-rows:55vh auto}aside{border-left:0;border-top:1px solid var(--line)}input{width:100%}}
</style></head><body>
<header>
 <h1>World Map</h1>
 <div class="tabs"><button id="b1" class="on">% offline</button><button id="b3">Conflicts</button><button id="b4">Military</button><button id="b2">Palantir</button><button id="bg">Guide</button></div>
 <input id="q" list="names" placeholder="Search a country…"><datalist id="names"></datalist>
</header>
<div class="wrap"><div id="map"></div><aside id="panel"></aside></div>
<script>
const byIso=Object.fromEntries(D.map(d=>[d.iso3,d]));
const byName=Object.fromEntries(D.map(d=>[d.name.toLowerCase(),d]));
const PC=PAL.countries, LV=PAL.levels;
const TYPES=['Contract','Legal','Controversy','Protest','Policy','Issue'];
const tcol=t=>`var(--t-${t.toLowerCase()})`;
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const fg=dark?'#ecebe6':'#1d1d1b',land=dark?'#2a2a27':'#e6e5df',border=dark?'#444':'#fff';
const fmt=n=>n==null?'n/a':n>=1e9?(n/1e9).toFixed(2)+' billion':n>=1e6?(n/1e6).toFixed(1)+' million':n>=1e3?Math.round(n/1e3)+' thousand':String(n);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const layout={geo:{showframe:false,showcoastlines:false,projection:{type:'natural earth'},bgcolor:'rgba(0,0,0,0)',showland:true,landcolor:land,showcountries:true,countrycolor:border},
 margin:{l:0,r:0,t:0,b:0},paper_bgcolor:'rgba(0,0,0,0)',font:{color:fg}};
const offline={type:'choropleth',locations:D.map(d=>d.iso3),z:D.map(d=>d.offline),
 text:D.map(d=>`<b>${d.name}</b><br>${d.offline}% offline (${d.year})<br>${fmt(d.offline_people)} people<br><i>Click for details</i>`),hoverinfo:'text',
 colorscale:[[0,'#e8f0fb'],[0.5,'#6b9be0'],[1,'#0b2e6b']],zmin:0,zmax:100,
 colorbar:{title:'% offline',ticksuffix:'%',thickness:12},marker:{line:{width:0.4,color:border}}};
const PI=Object.keys(PC).filter(i=>byIso[i]);
const count=(i,t)=>PC[i].items.filter(x=>x.type==t).length;
const LCOL=['#94a3b8','#f6c08a','#ee8a3c','#c2410c'];
const pal={type:'choropleth',locations:PI,z:PI.map(i=>PC[i].level),
 text:PI.map(i=>`<b>${byIso[i].name}</b><br>${LV[PC[i].level]}<br>${PC[i].items.length} items: `+TYPES.filter(t=>count(i,t)).map(t=>`${count(i,t)} ${t.toLowerCase()}`).join(', ')+'<br><i>Click for details</i>'),hoverinfo:'text',
 colorscale:LCOL.flatMap((c,k)=>[[k/4,c],[(k+1)/4,c]]),zmin:0.5,zmax:4.5,
 colorbar:{tickvals:[1,2,3,4],ticktext:[1,2,3,4].map(l=>LV[l]),thickness:12},marker:{line:{width:0.4,color:border}}};
// ----- conflicts and military -----
const CONF=X.conflicts||[], MIL=X.military||{}, FORCES=X.forces||{}, EQUIP=X.equipment||{}, DISP=X.disputes||{};
const confOf={};CONF.forEach(c=>c.involved.forEach(i=>(confOf[i]=confOf[i]||[]).push(c)));
const nm=i=>byIso[i]?byIso[i].name:i;
const CI=D.map(d=>d.iso3).filter(i=>confOf[i]);
const isActive=(c,i)=>c.active&&(!i||!c.span||!c.span[i]||c.span[i][1]==X.ucdp_last_year);
const activeN=i=>(confOf[i]||[]).filter(c=>isActive(c,i)).length;
const sides=l=>l.length>8?l.slice(0,8).join(', ')+` and ${l.length-8} more`:l.join(', ');
const conflicts={type:'choropleth',locations:CI,z:CI.map(i=>confOf[i].length),
 text:CI.map(i=>`<b>${nm(i)}</b><br>${confOf[i].length} armed conflicts since 1946<br>${activeN(i)} active in ${X.ucdp_last_year}${DISP[i]?`<br>${DISP[i].length} disputed territories`:''}<br><i>Click for details</i>`),hoverinfo:'text',
 colorscale:[[0,'#fde2e2'],[0.5,'#f87171'],[1,'#7f1d1d']],zmin:0,zmax:30,
 colorbar:{title:'Conflicts',thickness:12},marker:{line:{width:0.4,color:border}}};
const MI=D.map(d=>d.iso3).filter(i=>MIL[i]&&MIL[i].mil_pct_gdp);
const money=v=>v>=1e9?'$'+(v/1e9).toFixed(1)+' billion':v>=1e6?'$'+(v/1e6).toFixed(0)+' million':'$'+Math.round(v).toLocaleString();
const eqN=i=>Object.values(EQUIP[i]||{}).reduce((s,v)=>s+v.length,0);
const military={type:'choropleth',locations:MI,z:MI.map(i=>Math.min(MIL[i].mil_pct_gdp[0],10)),
 text:MI.map(i=>{const m=MIL[i];return `<b>${nm(i)}</b><br>Military spending: ${m.mil_pct_gdp[0]}% of GDP (${m.mil_pct_gdp[1]})`+(m.mil_usd?`<br>${money(m.mil_usd[0])}`:'')+(m.mil_personnel?`<br>${fmt(m.mil_personnel[0])} personnel`:'')+`<br>${(FORCES[i]||[]).length} forces & units, ${eqN(i)} equipment items<br><i>Click for details</i>`}),hoverinfo:'text',
 colorscale:[[0,'#e7f5ec'],[0.5,'#4ca36f'],[1,'#14532d']],zmin:0,zmax:6,
 colorbar:{title:'% of GDP',ticksuffix:'%',thickness:12},marker:{line:{width:0.4,color:border}}};
const VIEWS={1:offline,2:pal,3:conflicts,4:military};
function show(w){
 Plotly.react('map',[VIEWS[w]],layout,{responsive:true,displaylogo:false,topojsonURL:'./'});
 [b1,b2,b3,b4].forEach((b,k)=>b.classList.toggle('on',w==k+1));
}
// lists that can be thousands long are only drawn when their section is opened
const lazy={};let lazyN=0;
function section(title,count,render,open){const id='lz'+(lazyN++);lazy[id]=render;
 return `<details id="${id}" ${open?'open':''} ontoggle="fill(this)"><summary>${esc(title)} <span>(${count.toLocaleString()})</span></summary><div class="body"></div></details>`;}
function fill(el){const b=el.querySelector('.body');if(el.open&&!b.dataset.done){b.innerHTML=lazy[el.id]();b.dataset.done=1;}}
function findIn(inp){const t=inp.value.toLowerCase();inp.parentNode.querySelectorAll('.row').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(t)?'':'none');}
function confHtml(c,iso){
 const other=c.involved.filter(i=>i!=iso).map(nm),live=isActive(c,iso),sp=iso&&c.span&&c.span[iso];
 const own=sp&&(sp[0]!=c.first||sp[1]!=c.last)?` · ${esc(nm(iso))} involved ${sp[0]}–${sp[1]==X.ucdp_last_year&&c.active?'present':sp[1]}`:'';
 return `<div class="conf" style="--c:${live?'#be123c':'var(--line)'}">${live?'<span class="live">ACTIVE</span>':''}<b>${esc(c.location)}${c.territory?': '+esc(c.territory):''}</b>
 ${esc(sides(c.side_a))} <i>vs</i> ${esc(sides(c.side_b))}
 <div class="meta">${c.first}–${c.active?'present':c.last}${own} · ${c.years_active} year(s) of fighting${c.war_years?`, ${c.war_years} at war level (1,000+ deaths/yr)`:''} · <span title="${esc(INFO[c.type]||'')}">${esc(c.type)}</span> · over ${esc(c.incompatibility.toLowerCase())}${other.length?` · other countries involved: ${esc(sides(other))}`:''}</div></div>`;
}
function conflictBlock(iso){
 const cs=confOf[iso]||[],ds=DISP[iso]||[];
 if(!cs.length&&!ds.length)return `<p class="none">No armed conflicts (25+ deaths a year) since 1946 and no disputed territories in the data.</p>`;
 const act=cs.filter(c=>isActive(c,iso)),past=cs.filter(c=>!isActive(c,iso));
 return `<p class="explain">Every armed conflict with 25+ battle deaths in a year that ${esc(nm(iso))} fought in or that took place on its land. Hover a conflict type for what it means, or open the Guide.</p><div class="stats"><div class="stat"><b>${act.length}</b><span>active conflicts (${X.ucdp_last_year})</span></div><div class="stat"><b>${cs.length}</b><span>conflicts since 1946</span></div></div>`
 +(act.length?section('Active conflicts',act.length,()=>act.map(c=>confHtml(c,iso)).join(''),true):'')
 +(past.length?section('Past conflicts',past.length,()=>past.map(c=>confHtml(c,iso)).join('')):'')
 +(ds.length?section('Disputed territories',ds.length,()=>ds.map(d=>`<div class="row"><b>${esc(d.name)}</b> <small>${esc(d.desc||'')}</small><br><small>Claimed by: ${esc(d.claimants.map(nm).join(', '))}</small></div>`).join('')):'');
}
// ----- photos: saved ones work offline, the rest load from Wikimedia Commons when online -----
const IMG=X.img||{};
const localImg=f=>f&&IMG[f]?'img/'+IMG[f]:'';
const webImg=(f,w)=>'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(f)+'?width='+(w||360);
const anyImg=f=>localImg(f)||(f?webImg(f,240):'');
const explain=k=>INFO[k]?`<p class="explain">${esc(INFO[k])}</p>`:'';
function photo(row){ // clicking an item shows its photo
 const f=row.dataset.img;if(!f)return;
 const s=row.querySelector('.shot,.off');if(s){s.remove();return;}
 const im=document.createElement('img');im.className='shot';im.alt='';im.src=localImg(f)||webImg(f);
 im.onerror=()=>{const p=document.createElement('span');p.className='off';p.textContent='Photo needs an internet connection.';im.replaceWith(p);};
 row.appendChild(im);
}
const picRow=(f,inner)=>`<div class="row${f?' pic':''}" ${f?`data-img="${esc(f)}" onclick="photo(this)"`:''}>${inner}</div>`;
function kindHead(kind,n){
 const ex=(X.kind_example||{})[kind],src=ex&&(localImg(ex.img)||'');
 return `<div class="kind">${src?`<img src="${src}" alt="" title="Example: ${esc(ex.name)}">`:''}<div><b>${esc(kind)} (${n})</b><p>${esc(INFO[kind]||'')}${src?` <i>Photo: ${esc(ex.name)}.</i>`:''}</p></div></div>`;
}
function equipList(cat,items){
 const order=(X.kind_order||{})[cat]||[],groups={};
 items.forEach(e=>(groups[e[1]]=groups[e[1]]||[]).push(e));
 const ks=Object.keys(groups).sort((a,b)=>((order.indexOf(a)+1)||99)-((order.indexOf(b)+1)||99));
 return explain(cat)+`<input class="ffind" placeholder="Filter…" oninput="findIn(this)">`+ks.map(k=>kindHead(k,groups[k].length)+groups[k].map(e=>
  picRow(e[4],`<b>${esc(e[0])}</b>${e[3]?` <small>· made in ${esc(nm(e[3]))}</small>`:''}${e[2]?`<br><small>${esc(e[2])}</small>`:''}`)).join('')).join('');
}
function militaryBlock(iso){
 const m=MIL[iso]||{},fs=FORCES[iso]||[],eq=EQUIP[iso]||{};
 const st=(k,f,l)=>m[k]?`<div class="stat"><b>${f(m[k][0])}</b><span>${l} (${m[k][1]})</span></div>`:'';
 let h=`<div class="stats">${st('mil_usd',money,'military spending')}${st('mil_pct_gdp',v=>v+'%','of GDP')}${st('mil_personnel',fmt,'armed forces personnel')}${st('arms_imports',money,'arms imports*')}${st('arms_exports',money,'arms exports*')}</div>`;
 const kinds=X.force_order.filter(k=>fs.some(f=>f.kind==k));
 if(kinds.length)h+=`<p class="explain">Click a name with 📷 to see its badge or photo.</p>`;
 kinds.forEach(k=>{const l=fs.filter(f=>f.kind==k);h+=section(k=='Other branch'?'Other branches & units':k,l.length,()=>explain(k)+`<input class="ffind" placeholder="Filter…" oninput="findIn(this)">`+l.map(f=>picRow(f.img,`<b>${esc(f.name)}</b>${f.ended?` <small>(disbanded ${esc(f.ended)})</small>`:''}${f.desc?`<br><small>${esc(f.desc)}</small>`:''}`)).join(''),k=='Special forces')});
 const cats=X.equipment_order.filter(c=>eq[c]);
 if(cats.length)h+=`<h3>Weapons, equipment & tech (${eqN(iso).toLocaleString()})</h3><p class="explain">Grouped by kind, with an explanation and an example photo for each kind. Click a name with 📷 to see its own photo.</p>`;
 cats.forEach(c=>{h+=section(c,eq[c].length,()=>equipList(c,eq[c]))});
 if(!fs.length&&!cats.length&&!m.mil_usd)h+=`<p class="none">No military data for this country.</p>`;
 return h;
}
function leadersBlock(iso){
 const p=(X.people||{})[iso];if(!p||!p.leaders.length)return '';
 return `<div class="people">${p.leaders.map(l=>{const src=localImg(l.img);return `<div class="person">${src?`<img src="${src}" alt="">`:'<div class="ph"></div>'}<div><span>${esc(l.role)}</span><b>${esc(l.name)}</b><span>${esc(l.desc||'')}</span></div></div>`}).join('')}</div>`;
}
function guide(){
 const cards=(list)=>list.map(k=>{const ex=(X.kind_example||{})[k],src=ex&&localImg(ex.img);
  return `<div class="gcard">${src?`<img src="${src}" alt="" title="${esc(ex.name)}">`:''}<div><b>${esc(k)}</b><p>${esc(INFO[k]||'')}${src?` <i>Photo: ${esc(ex.name)}.</i>`:''}</p></div></div>`}).join('');
 panel.innerHTML=`<a class="back" onclick="world()">← World overview</a><h2>Guide</h2><p class="sub">What every topic, kind of weapon and military term in this app means.</p>
 <h3>Topics</h3>${GUIDE_TOPICS.map(([t,d])=>`<div class="gcard"><div><b>${esc(t)}</b><p>${esc(d)}</p></div></div>`).join('')}
 <h3>Kinds of conflict</h3>${cards(Object.values(CTYPES))}
 <h3>Military forces</h3>${cards(['Armed forces','Army','Navy','Air force','Special forces','Other branch'])}
 ${X.equipment_order.map(c=>section(c,((X.kind_order||{})[c]||[]).length,()=>explain(c)+cards((X.kind_order||{})[c]||[]))).join('')}
 ${note()}`;
 panel.scrollTop=0;q.value='';
}
const CTYPES={1:'Between countries (interstate)',2:'Civil war (intrastate)',3:'Civil war with foreign troops (internationalized)',4:'Colonial (extrasystemic)'};
function trend(h){
 const W=360,H=90,p=22,xs=h.map(r=>r[0]),y0=xs[0],y1=xs[xs.length-1];
 const X=y=>p+(W-2*p)*(y1==y0?0:(y-y0)/(y1-y0)),Y=v=>H-16-(H-26)*v/100;
 return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="${p}" x2="${W-p}" y1="${Y(100)}" y2="${Y(100)}" stroke="var(--line)"/><line x1="${p}" x2="${W-p}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/>
 <text x="0" y="${Y(0)+3}">0%</text><text x="0" y="${Y(100)+3}">100%</text>
 <polyline points="${h.map(r=>`${X(r[0]).toFixed(1)},${Y(r[1]).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--warm)" stroke-width="2"/>
 ${h.map(r=>`<circle cx="${X(r[0])}" cy="${Y(r[1])}" r="2.5" fill="var(--warm)"><title>${r[0]}: ${r[1]}% offline</title></circle>`).join('')}
 <text x="${X(y0)-8}" y="${H-2}">${y0}</text><text x="${X(y1)-12}" y="${H-2}">${y1}</text></svg>`;
}
function items(list,id){
 if(!list.length)return '';
 const sorted=[...list].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const types=TYPES.filter(t=>list.some(x=>x.type==t));
 return `<div class="filters" id="${id}"><button class="on" data-t="">All (${list.length})</button>${types.map(t=>`<button data-t="${t}">${t} (${list.filter(x=>x.type==t).length})</button>`).join('')}</div>
 <div id="${id}-list">${sorted.map(x=>`<div class="item" data-t="${esc(x.type)}" style="--c:${tcol(x.type)}"><span class="tag">${esc(x.type)}</span><b>${esc(x.title)}</b>${esc(x.detail)}
 <div class="meta">${[x.date,x.status].filter(Boolean).map(esc).join(' · ')}${x.source?` · <a href="${esc(x.source)}" target="_blank" rel="noopener">Source</a>`:''}</div></div>`).join('')}</div>`;
}
function wireFilters(id){
 const f=document.getElementById(id);if(!f)return;
 f.onclick=e=>{const t=e.target.dataset.t;if(t===undefined)return;
  f.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b==e.target));
  document.querySelectorAll(`#${id}-list .item`).forEach(el=>el.style.display=!t||el.dataset.t==t?'':'none');};
}

 ${note()}`;

}

 <h3>Biggest military spenders</h3><ol>${Object.keys(MIL).filter(i=>byIso[i]&&MIL[i].mil_usd).sort((a,b)=>MIL[b].mil_usd[0]-MIL[a].mil_usd[0]).slice(0,10).map(i=>li(byIso[i])+`${esc(nm(i))}: ${money(MIL[i].mil_usd[0])}</li>`).join('')}</ol>

 <h3>Palantir: international and Europe-wide</h3>${items([...PAL.summary,...PAL.international],'wf')}

 wireFilters('wf');q.value='';panel.scrollTop=0;
}
