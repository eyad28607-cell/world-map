<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Map</title>
<script src="plotly.min.js"></script>
<script src="data.js"></script>
<script src="extra.js"></script>
<script src="guide.js"></script>
<style>
:root{--bg:#fafaf8;--fg:#1d1d1b;--muted:#6b6b66;--card:#fff;--line:#e3e2dc;--accent:#2a6fdb;--warm:#c2410c;--soft:#f3f2ee;
 --t-contract:#2a6fdb;--t-legal:#7c3aed;--t-controversy:#c2410c;--t-protest:#be123c;--t-policy:#0f766e;--t-issue:#a16207}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ecebe6;--muted:#a3a29b;--card:#1e1e1c;--line:#33332f;--accent:#6ea0ff;--warm:#f08a4b;--soft:#262624;
 --t-contract:#6ea0ff;--t-legal:#a78bfa;--t-controversy:#f08a4b;--t-protest:#fb7185;--t-policy:#2dd4bf;--t-issue:#facc15}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0;flex:1 1 auto}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
input{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);width:220px}
.wrap{flex:1;display:grid;grid-template-columns:1fr 400px;min-height:0}
#map{min-height:0}
aside{border-left:1px solid var(--line);overflow:auto;padding:16px;background:var(--card)}
aside h2{font-size:20px;margin:0 0 2px}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
.sub{color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--soft);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.bar{height:8px;border-radius:4px;background:var(--accent);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--warm)}
.legend{font-size:12px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.filters button{font-size:12px;padding:2px 8px}
.item{border-left:3px solid var(--c);padding:6px 0 6px 10px;margin:6px 0}
.item b{display:block}
.item .meta{font-size:12px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;color:#fff;background:var(--c);margin-right:6px}
.item a{color:var(--accent);font-size:12px}
.none{color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--warm);color:#fff}
ol{padding-left:22px;margin:0}ol li{cursor:pointer;padding:2px 0}ol li:hover{color:var(--accent)}
a.back{color:var(--accent);cursor:pointer;font-size:13px}
svg text{fill:var(--muted);font-size:10px}
.note{font-size:11px;color:var(--muted);margin-top:20px}
.live{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;background:#be123c;color:#fff;margin-right:6px}
.titlebar{display:flex;align-items:center;gap:10px}
.flag{height:28px;border-radius:3px;border:1px solid var(--line)}
.people{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.person{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:8px;padding:6px}
.person img,.person .ph{width:52px;height:64px;object-fit:cover;border-radius:6px;flex:none;background:var(--line)}
.person b{display:block;font-size:13px;line-height:1.3}
.person span{font-size:11px;color:var(--muted)}
@media (max-width:800px){.wrap{grid-template-columns:1fr;grid-template-rows:55vh auto}aside{border-left:0;border-top:1px solid var(--line)}input{width:100%}}
.explain{font-size:13px;color:var(--muted);margin:2px 0 8px}
.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.ptile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.ptile:hover{border-color:var(--accent)}
.ptile span{font-size:20px}.ptile b{font-size:14px;line-height:1.3}.ptile small{color:var(--accent)}
.bigbtn{display:block;width:100%;margin:10px 0;padding:10px;font-weight:600;background:var(--accent);border-color:var(--accent);color:#fff;border-radius:10px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;color:#fff;background:var(--c);margin-right:6px}
/* full-screen reader */
#reader{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10;font-size:16px;line-height:1.6}
#reader[hidden]{display:none}
.rbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.rbar h1{flex:1;font-size:20px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar button{font-size:15px;padding:8px 14px}
#rbody{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
#rbody h2{font-size:24px;margin:32px 0 8px}
#rbody h3{font-size:18px;margin:22px 0 6px}
.lead{font-size:18px}.muted{color:var(--muted)}
.rfind{width:100%;font-size:16px;padding:10px 14px;margin:12px 0}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.jump a{cursor:pointer;padding:6px 12px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:14px}
.jump a small{color:var(--muted)}
.kindsec{margin-top:28px}
.khead{display:flex;gap:16px;align-items:center;padding:14px;border-radius:12px;background:var(--soft);margin-bottom:12px}
.khead img{width:180px;height:120px;object-fit:cover;border-radius:8px;flex:none}
.khead h2{margin:0 !important}.khead small{color:var(--muted);font-weight:400}.khead p{margin:4px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1.5}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card img,.card .noimg{width:100%;height:170px;object-fit:cover;background:var(--soft)}
.card.unit img{object-fit:contain;padding:10px}
.noimg{display:flex;align-items:center;justify-content:center;font-size:48px;background:var(--soft);color:var(--muted)}
.ctext{padding:12px 14px}.ctext b{font-size:17px;display:block}.ctext p{margin:4px 0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips span{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft)}
.more{grid-column:1/-1;padding:12px;font-size:15px}
.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
.bigpic img,.bigpic .noimg{width:100%;max-height:560px;object-fit:cover;border-radius:12px;min-height:240px}
.bigpic.contain img{object-fit:contain;background:var(--soft);padding:20px}
.dtext h2{margin-top:0 !important;font-size:30px !important}
.kindtag{color:var(--accent);font-weight:600;margin:0}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:14px 0}
.fact{background:var(--soft);border-radius:10px;padding:10px 12px}.fact span{display:block;font-size:12px;color:var(--muted)}.fact b{font-size:16px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.ccard{padding:16px;border-radius:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line)}
.ccard.on{border-left-color:#be123c}.ccard h3{margin:4px 0 8px !important}
.vs{margin:6px 0}.vs span{color:var(--muted);font-size:13px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.gitem{display:flex;gap:14px;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.gitem img,.gitem .noimg{width:130px;height:90px;object-fit:cover;border-radius:8px;flex:none;font-size:32px}
.gitem b{font-size:17px}.gitem p{margin:4px 0}
.chead{display:flex;gap:16px;align-items:center}.bigflag{height:56px;border-radius:4px;border:1px solid var(--line)}.chead h2{margin:0 !important}
.leaders{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:16px}
.leader{display:flex;gap:14px;align-items:center;padding:12px;border-radius:12px;background:var(--soft)}
.leader img,.leader .noimg{width:90px;height:110px;object-fit:cover;border-radius:8px;flex:none}
.leader span{font-size:13px;color:var(--muted)}.leader b{display:block;font-size:18px}.leader p{margin:2px 0;font-size:14px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:left}
.tile:hover{border-color:var(--accent)}.ticon{font-size:28px}.tile b{font-size:16px}.tile small{color:var(--accent);font-size:14px}
.pitem{padding:12px 0;border-top:1px solid var(--line)}.pitem b{display:block;font-size:17px}.pitem p{margin:4px 0}
@media (max-width:800px){.detail{grid-template-columns:1fr}.khead{flex-direction:column;align-items:flex-start}.khead img{width:100%;height:180px}.cgrid,.ggrid{grid-template-columns:1fr}}
</style></head><body>
<header>
 <h1>World Map</h1>
 <div class="tabs"><button id="b1" class="on">% offline</button><button id="b3">Conflicts</button><button id="b4">Military</button><button id="b2">Palantir</button><button id="bg">Guide</button></div>
 <input id="q" list="names" placeholder="Search a country…"><datalist id="names"></datalist>
</header>
<div class="wrap"><div id="map"></div><aside id="panel"></aside></div>
<div id="reader" hidden><div class="rbar"><button id="rback" hidden>← Back</button><h1 id="rtitle"></h1><button id="rclose">✕ Close</button></div><div id="rbody"></div></div>
<script>
const byIso=Object.fromEntries(D.map(d=>[d.iso3,d]));
const byName=Object.fromEntries(D.map(d=>[d.name.toLowerCase(),d]));
const PC=PAL.countries, LV=PAL.levels;
const TYPES=['Contract','Legal','Controversy','Protest','Policy','Issue'];
const tcol=t=>`var(--t-${t.toLowerCase()})`;
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const fg=dark?'#ecebe6':'#1d1d1b',land=dark?'#2a2a27':'#e6e5df',border=dark?'#444':'#fff';
const fmt=n=>n==null?'n/a':n>=1e9?(n/1e9).toFixed(2)+' billion':n>=1e6?(n/1e6).toFixed(1)+' million':n>=1e3?Math.round(n/1e3)+' thousand':String(n);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const layout={geo:{showframe:false,showcoastlines:false,projection:{type:'natural earth'},bgcolor:'rgba(0,0,0,0)',showland:true,landcolor:land,showcountries:true,countrycolor:border},
 margin:{l:0,r:0,t:0,b:0},paper_bgcolor:'rgba(0,0,0,0)',font:{color:fg}};
const offline={type:'choropleth',locations:D.map(d=>d.iso3),z:D.map(d=>d.offline),
 text:D.map(d=>`<b>${d.name}</b><br>${d.offline}% offline (${d.year})<br>${fmt(d.offline_people)} people<br><i>Click for details</i>`),hoverinfo:'text',
 colorscale:[[0,'#e8f0fb'],[0.5,'#6b9be0'],[1,'#0b2e6b']],zmin:0,zmax:100,
 colorbar:{title:'% offline',ticksuffix:'%',thickness:12},marker:{line:{width:0.4,color:border}}};
const PI=Object.keys(PC).filter(i=>byIso[i]);
const count=(i,t)=>PC[i].items.filter(x=>x.type==t).length;
const LCOL=['#94a3b8','#f6c08a','#ee8a3c','#c2410c'];
const pal={type:'choropleth',locations:PI,z:PI.map(i=>PC[i].level),
 text:PI.map(i=>`<b>${byIso[i].name}</b><br>${LV[PC[i].level]}<br>${PC[i].items.length} items: `+TYPES.filter(t=>count(i,t)).map(t=>`${count(i,t)} ${t.toLowerCase()}`).join(', ')+'<br><i>Click for details</i>'),hoverinfo:'text',
 colorscale:LCOL.flatMap((c,k)=>[[k/4,c],[(k+1)/4,c]]),zmin:0.5,zmax:4.5,
 colorbar:{tickvals:[1,2,3,4],ticktext:[1,2,3,4].map(l=>LV[l]),thickness:12},marker:{line:{width:0.4,color:border}}};
// ----- conflicts and military -----
const CONF=X.conflicts||[], MIL=X.military||{}, FORCES=X.forces||{}, EQUIP=X.equipment||{}, DISP=X.disputes||{};
const confOf={};CONF.forEach(c=>c.involved.forEach(i=>(confOf[i]=confOf[i]||[]).push(c)));
const nm=i=>byIso[i]?byIso[i].name:i;
const CI=D.map(d=>d.iso3).filter(i=>confOf[i]);
const isActive=(c,i)=>c.active&&(!i||!c.span||!c.span[i]||c.span[i][1]==X.ucdp_last_year);
const activeN=i=>(confOf[i]||[]).filter(c=>isActive(c,i)).length;
const sides=l=>l.length>8?l.slice(0,8).join(', ')+` and ${l.length-8} more`:l.join(', ');
const conflicts={type:'choropleth',locations:CI,z:CI.map(i=>confOf[i].length),
 text:CI.map(i=>`<b>${nm(i)}</b><br>${confOf[i].length} armed conflicts since 1946<br>${activeN(i)} active in ${X.ucdp_last_year}${DISP[i]?`<br>${DISP[i].length} disputed territories`:''}<br><i>Click for details</i>`),hoverinfo:'text',
 colorscale:[[0,'#fde2e2'],[0.5,'#f87171'],[1,'#7f1d1d']],zmin:0,zmax:30,
 colorbar:{title:'Conflicts',thickness:12},marker:{line:{width:0.4,color:border}}};
const MI=D.map(d=>d.iso3).filter(i=>MIL[i]&&MIL[i].mil_pct_gdp);
const money=v=>v>=1e9?'$'+(v/1e9).toFixed(1)+' billion':v>=1e6?'$'+(v/1e6).toFixed(0)+' million':'$'+Math.round(v).toLocaleString();
const eqN=i=>Object.values(EQUIP[i]||{}).reduce((s,v)=>s+v.length,0);
const military={type:'choropleth',locations:MI,z:MI.map(i=>Math.min(MIL[i].mil_pct_gdp[0],10)),
 text:MI.map(i=>{const m=MIL[i];return `<b>${nm(i)}</b><br>Military spending: ${m.mil_pct_gdp[0]}% of GDP (${m.mil_pct_gdp[1]})`+(m.mil_usd?`<br>${money(m.mil_usd[0])}`:'')+(m.mil_personnel?`<br>${fmt(m.mil_personnel[0])} personnel`:'')+`<br>${(FORCES[i]||[]).length} forces & units, ${eqN(i)} equipment items<br><i>Click for details</i>`}),hoverinfo:'text',
 colorscale:[[0,'#e7f5ec'],[0.5,'#4ca36f'],[1,'#14532d']],zmin:0,zmax:6,
 colorbar:{title:'% of GDP',ticksuffix:'%',thickness:12},marker:{line:{width:0.4,color:border}}};
const VIEWS={1:offline,2:pal,3:conflicts,4:military};
function show(w){
 Plotly.react('map',[VIEWS[w]],layout,{responsive:true,displaylogo:false,topojsonURL:'./'});
 [b1,b2,b3,b4].forEach((b,k)=>b.classList.toggle('on',w==k+1));
}
function conflictBlock(iso){
 const cs=confOf[iso]||[],ds=DISP[iso]||[];
 if(!cs.length&&!ds.length)return `<p class="none">No armed conflicts (25+ deaths a year) since 1946 and no disputed territories in the data.</p>`;
 const act=cs.filter(c=>isActive(c,iso)),past=cs.filter(c=>!isActive(c,iso));
 return `<p class="explain">Every armed conflict with 25+ battle deaths in a year that ${esc(nm(iso))} fought in or that took place on its land. </p><div class="stats"><div class="stat"><b>${act.length}</b><span>active conflicts (${X.ucdp_last_year})</span></div><div class="stat"><b>${cs.length}</b><span>conflicts since 1946</span></div></div>`
 +`<div class="ptiles">${tile('Read all conflicts & disputes',cs.length+ds.length,`openConflicts('${iso}')`,'⚔️')}</div>`;
}
// ----- photos: saved ones work offline, the rest load from Wikimedia Commons when online -----
const IMG=X.img||{};
const localImg=f=>f&&IMG[f]?'img/'+IMG[f]:'';
const webImg=(f,w)=>'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(f)+'?width='+(w||360);
const tile=(label,n,js,icon)=>`<button class="ptile" onclick="${js}"><span>${icon||''}</span><b>${esc(label)}</b><small>${n.toLocaleString()} ›</small></button>`;
function militaryBlock(iso){
 const m=MIL[iso]||{},fs=FORCES[iso]||[],eq=EQUIP[iso]||{};
 const st=(k,f,l)=>m[k]?`<div class="stat"><b>${f(m[k][0])}</b><span>${l} (${m[k][1]})</span></div>`:'';
 let h=`<div class="stats">${st('mil_usd',money,'military spending')}${st('mil_pct_gdp',v=>v+'%','of GDP')}${st('mil_personnel',fmt,'armed forces personnel')}${st('arms_imports',money,'arms imports*')}${st('arms_exports',money,'arms exports*')}</div>`;
 const kinds=X.force_order.filter(k=>fs.some(f=>f.kind==k));
 if(kinds.length)h+=`<p class="explain">Click to open a full page with photos and details.</p><div class="ptiles">${kinds.map(k=>tile(k=='Other branch'?'Other branches & units':k,fs.filter(f=>f.kind==k).length,`openForces('${iso}','${k}')`,k=='Special forces'?'🎯':'🎖️')).join('')}</div>`;
 const cats=X.equipment_order.filter(c=>eq[c]);
 if(cats.length)h+=`<h3>Weapons, equipment & tech (${eqN(iso).toLocaleString()})</h3><div class="ptiles">${cats.map(c=>tile(c,eq[c].length,`openEquip('${iso}','${c}')`,ICON[c])).join('')}</div>`;
 if(!fs.length&&!cats.length&&!m.mil_usd)h+=`<p class="none">No military data for this country.</p>`;
 return h;
}
function leadersOf(iso){ // one card per person, e.g. a president who is head of state and of government
 const out=[];((X.people||{})[iso]||{leaders:[]}).leaders.forEach(l=>{const s=out.find(x=>x.name==l.name);if(s)s.role='Head of state and government';else out.push({...l});});
 return out;
}
function leadersBlock(iso){
 const ls=leadersOf(iso);if(!ls.length)return '';
 return `<div class="people">${ls.map(l=>{const src=localImg(l.img);return `<div class="person">${src?`<img src="${src}" alt="">`:'<div class="ph"></div>'}<div><span>${esc(l.role)}</span><b>${esc(l.name)}</b><span>${esc(l.desc||'')}</span></div></div>`}).join('')}</div>`;
}
const CTYPES={1:'Between countries (interstate)',2:'Civil war (intrastate)',3:'Civil war with foreign troops (internationalized)',4:'Colonial (extrasystemic)'};
function trend(h){
 const W=360,H=90,p=22,xs=h.map(r=>r[0]),y0=xs[0],y1=xs[xs.length-1];
 const X=y=>p+(W-2*p)*(y1==y0?0:(y-y0)/(y1-y0)),Y=v=>H-16-(H-26)*v/100;
 return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="${p}" x2="${W-p}" y1="${Y(100)}" y2="${Y(100)}" stroke="var(--line)"/><line x1="${p}" x2="${W-p}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/>
 <text x="0" y="${Y(0)+3}">0%</text><text x="0" y="${Y(100)+3}">100%</text>
 <polyline points="${h.map(r=>`${X(r[0]).toFixed(1)},${Y(r[1]).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--warm)" stroke-width="2"/>
 ${h.map(r=>`<circle cx="${X(r[0])}" cy="${Y(r[1])}" r="2.5" fill="var(--warm)"><title>${r[0]}: ${r[1]}% offline</title></circle>`).join('')}
 <text x="${X(y0)-8}" y="${H-2}">${y0}</text><text x="${X(y1)-12}" y="${H-2}">${y1}</text></svg>`;
}
function items(list,id){
 if(!list.length)return '';
 const sorted=[...list].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const types=TYPES.filter(t=>list.some(x=>x.type==t));
 return `<div class="filters" id="${id}"><button class="on" data-t="">All (${list.length})</button>${types.map(t=>`<button data-t="${t}">${t} (${list.filter(x=>x.type==t).length})</button>`).join('')}</div>
 <div id="${id}-list">${sorted.map(x=>`<div class="item" data-t="${esc(x.type)}" style="--c:${tcol(x.type)}"><span class="tag">${esc(x.type)}</span><b>${esc(x.title)}</b>${esc(x.detail)}
 <div class="meta">${[x.date,x.status].filter(Boolean).map(esc).join(' · ')}${x.source?` · <a href="${esc(x.source)}" target="_blank" rel="noopener">Source</a>`:''}</div></div>`).join('')}</div>`;
}
function wireFilters(id){
 const f=document.getElementById(id);if(!f)return;
 f.onclick=e=>{const t=e.target.dataset.t;if(t===undefined)return;
  f.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b==e.target));
  document.querySelectorAll(`#${id}-list .item`).forEach(el=>el.style.display=!t||el.dataset.t==t?'':'none');};
}
const note=()=>`<p class="note">Offline data: World Bank / ITU, rebuilt ${esc(META.built)}. People offline = population × % offline.<br>
Conflicts: UCDP/PRIO Armed Conflict Dataset v${esc(X.ucdp_version)} (Uppsala University), every armed conflict with 25+ battle deaths in a year, 1946–${X.ucdp_last_year}. Disputed territories, armed forces, special forces and equipment: Wikidata (community-edited, so some entries are missing or historic). Military spending, personnel and arms trade: World Bank / SIPRI. *Arms trade is in SIPRI trend-indicator values, not exact dollars. Flags, leaders and photos: Wikidata and Wikimedia Commons (each photo under its own free licence); leaders are as recorded on Wikidata and may be out of date.<br>Palantir list last updated ${esc(META.palantir_updated)}. Hand-compiled from news reports, company filings and official records; it is not complete and some items are single-source. Click "Source" to read the original.</p>`;
function country(d){
 const h=d.history.map(r=>[r[0],+(100-r[1]).toFixed(1)]),first=h[0],change=+(d.offline-first[1]).toFixed(1),pc=PC[d.iso3];
 panel.innerHTML=`<a class="back" onclick="world()">← World overview</a>
 <button class="bigbtn" onclick="openCountry('${d.iso3}')">📖 Open full page for ${esc(d.name)}</button>
 <div class="titlebar">${(()=>{const f=localImg(((X.people||{})[d.iso3]||{}).flag);return f?`<img class="flag" src="${f}" alt="">`:''})()}<div><h2>${esc(d.name)}</h2><p class="sub">${esc(d.region)}</p></div></div>
 ${leadersBlock(d.iso3)}
 <h3>Offline population</h3>
 <div class="stats">
  <div class="stat"><b>${d.offline}%</b><span>offline (${d.year})</span></div>
  <div class="stat"><b>${fmt(d.offline_people)}</b><span>people offline (est.)</span></div>
  <div class="stat"><b>#${d.rank}</b><span>of ${D.length} most offline</span></div>
  <div class="stat"><b>${change>0?'+':''}${change} pts</b><span>change since ${first[0]}</span></div>
 </div>
 <div class="bar"><i style="width:${d.offline}%"></i></div>
 <div class="legend">Orange = offline (${d.offline}%), blue = online (${d.online}%). Population ${fmt(d.pop)}.</div>
 <h3>% offline over time</h3>${trend(h)}
 <h3>Conflicts, wars & disputes</h3>${conflictBlock(d.iso3)}
 <h3>Military, special forces & weapons</h3>${militaryBlock(d.iso3)}
 <h3>Palantir: contracts, incidents and issues</h3>
 ${pc?`<span class="pill" style="background:${LCOL[pc.level-1]}">${esc(LV[pc.level])}</span>`+items(pc.items,'cf')
  :`<p class="none">No reported Palantir government contracts, incidents or issues in this list.</p>`}
 ${note()}`;
 wireFilters('cf');q.value=d.name;panel.scrollTop=0;
}
function world(){
 const tot=D.reduce((s,d)=>s+(d.offline_people||0),0);
 const top=[...D].sort((a,b)=>a.rank-b.rank).slice(0,10);
 const most=[...D].filter(d=>d.offline_people).sort((a,b)=>b.offline_people-a.offline_people).slice(0,10);
 const all=Object.values(PC).flatMap(c=>c.items);
 const li=d=>`<li onclick="country(byIso['${d.iso3}'])">`;
 panel.innerHTML=`<h2>World overview</h2><p class="sub">Click a country on the map, or search for one, to see everything about it.</p>
 <div class="stats" style="margin-top:12px">
  <div class="stat"><b>${fmt(tot)}</b><span>people offline in ${D.length} countries</span></div>
  <div class="stat"><b>${PI.length}</b><span>countries in the Palantir list</span></div>
  <div class="stat"><b>${all.filter(x=>x.type=='Contract').length}</b><span>Palantir contracts listed</span></div>
  <div class="stat"><b>${all.length-all.filter(x=>x.type=='Contract').length}</b><span>incidents, lawsuits and issues</span></div>
 </div>
 <h3>Highest % offline</h3><ol>${top.map(d=>li(d)+`${esc(d.name)}: ${d.offline}%</li>`).join('')}</ol>
 <h3>Most people offline</h3><ol>${most.map(d=>li(d)+`${esc(d.name)}: ${fmt(d.offline_people)}</li>`).join('')}</ol>
 <h3>Armed conflicts</h3><div class="ptiles">${tile('All conflicts since 1946 ('+CONF.filter(c=>c.active).length+' active)',CONF.length,'openConflicts()','⚔️')}${tile('Guide: what everything means',X.equipment_order.length+3,'openGuide()','📘')}</div>
 <h3>Biggest military spenders</h3><ol>${Object.keys(MIL).filter(i=>byIso[i]&&MIL[i].mil_usd).sort((a,b)=>MIL[b].mil_usd[0]-MIL[a].mil_usd[0]).slice(0,10).map(i=>li(byIso[i])+`${esc(nm(i))}: ${money(MIL[i].mil_usd[0])}</li>`).join('')}</ol>
 <h3>Palantir countries</h3><ol>${[...PI].sort((a,b)=>PC[b].level-PC[a].level||PC[b].items.length-PC[a].items.length).map(i=>li(byIso[i])+`${esc(byIso[i].name)}: ${PC[i].items.length} items <span class="sub">(${esc(LV[PC[i].level])})</span></li>`).join('')}</ol>
 <h3>Palantir: international and Europe-wide</h3>${items([...PAL.summary,...PAL.international],'wf')}
 ${note()}`;
 wireFilters('wf');q.value='';panel.scrollTop=0;
}
names.innerHTML=D.map(d=>`<option value="${esc(d.name)}">`).join('');
q.addEventListener('change',()=>{const d=byName[q.value.trim().toLowerCase()];if(d)country(d)});
b1.onclick=()=>show(1);b2.onclick=()=>show(2);b3.onclick=()=>show(3);b4.onclick=()=>show(4);bg.onclick=()=>openGuide();
show(1);world();
document.getElementById('map').on('plotly_click',e=>{const d=byIso[e.points[0].location];if(d)country(d)});
</script>
<script src="reader.js"></script></body></html>
