name: Build and release

on:
  schedule:
    - cron: "0 6 1 1 *"  # 06:00 UTC on 1 January: refresh data and rebuild
  push:
    tags: ["v*"]          # pushing a version tag builds a release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data
        working-directory: app
        run: python build_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/data.js app/assets/meta.json app/assets/extra.js app/assets/extra.json world-data.csv
          if ! git diff --cached --quiet; then git commit -m "Yearly data update" && git push; fi

  build:
    needs: refresh-data
    if: always() && (needs.refresh-data.result == 'success' || needs.refresh-data.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: dist/WorldMap.exe
            deps: pywebview pyinstaller pillow
          - os: macos-latest
            file: dist/WorldMap-macOS.zip
            deps: pywebview pyinstaller pillow
          - os: ubuntu-22.04
            file: dist/WorldMap-linux.tar.gz
            deps: pywebview[qt] pyinstaller pillow
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2
      - name: Install tools
        run: pip install ${{ matrix.deps }}
      - name: Build app
        run: python app/build.py
      - name: Self-test the built app (opens every main page in the real window)
        shell: bash
        env:
          WORLDMAP_SELFTEST: ${{ runner.temp }}/selftest.json
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox
        run: |
          case "$RUNNER_OS" in
            Windows) timeout 300 ./dist/WorldMap.exe ;;
            macOS)   perl -e 'alarm 300; exec @ARGV' ./dist/WorldMap.app/Contents/MacOS/WorldMap ;;  # macOS has no `timeout`
            Linux)   timeout 300 xvfb-run -a ./dist/WorldMap/WorldMap ;;
          esac || true
          cat "$WORLDMAP_SELFTEST"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); bad=[k for k,v in r.items() if not v]; print('FAILED:', bad) if bad else print('All checks passed'); sys.exit(1 if bad else 0)" "$WORLDMAP_SELFTEST"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.file }}

  release:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="data-$(date +%Y-%m-%d)"; fi
          gh release create "$TAG" out/*/* --repo "${{ github.repository }}" --title "World Map $TAG" \
            --notes "Windows: WorldMap.exe. macOS: unzip WorldMap-macOS.zip, then right-click WorldMap.app > Open the first time (the app is not signed). Linux: extract WorldMap-linux.tar.gz and run WorldMap/WorldMap."
