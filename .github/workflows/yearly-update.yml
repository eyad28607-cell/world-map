name: Yearly data update

on:
  schedule:
    - cron: "0 6 1 1 *"  # 06:00 UTC on 1 January
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install pywebview pyinstaller pillow
      - name: Refresh data
        working-directory: app
        run: python build_data.py
      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/data.js app/assets/meta.json world-data.csv
          git diff --cached --quiet || git commit -m "Yearly data update" && git push
      - name: Build app
        working-directory: app
        run: pyinstaller --noconfirm --onefile --windowed --name WorldMap --icon icon.ico --add-data "assets;assets" --add-data "icon.ico;." main.py
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="data-$(date +%Y-%m-%d)"
          gh release create "$TAG" app/dist/WorldMap.exe --title "World Map ($(date +%Y) data)" --notes "Yearly rebuild with refreshed World Bank data."
